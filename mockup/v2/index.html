<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splat.js — Gaussian splat training in the browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/v2.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">◐</span>
    <span class="brand-name">Splat<em>.js</em></span>
  </div>
  <button class="tbtn" id="btn-new" hidden>← Train another set</button>
  <span class="set-name" id="set-name" hidden></span>
  <span class="grow"></span>
  <a class="tbtn ghlink" id="gh" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>Source</a>
  </header>

<main class="stage" id="stage" data-cursor="grab">
  <canvas id="cv"></canvas>

  <div class="hud" id="hud"></div>

  <div class="controls" id="controls" hidden></div>

  <div class="card-start" id="start" hidden>
    <button class="card-x" id="card-x" hidden aria-label="Keep the current run">&times;</button>
    <div class="setpick" id="setpick"></div>
    <p class="eyebrow" id="start-kind">—</p>
    <h1 id="start-title">—</h1>
    <p class="origin" id="start-origin">—</p>
    <p class="srclinks" id="start-links"></p>
    <p class="runs" id="card-runs">Landmarks, camera solve and splat training all run here,
      in this tab. No upload, no download, no server.</p>
    <button class="btn btn-accent big" id="btn-go">Start training</button>
  </div>
</main>

<div class="strip" id="strip"></div>
<footer class="dock" id="dock"></footer>

<section class="sheet" id="details" hidden>
  <div class="sheet-head">
    <div>
      <h2>What just happened</h2>
      <p id="d-sub">—</p>
    </div>
    <button class="tbtn" id="d-close">Close</button>
  </div>
  <div class="sheet-body">
    <div class="sheet-row">
      <div class="sheet-vis">
        <div class="seg" id="d-seg"></div>
        <canvas id="d-cv"></canvas>
        <p class="cap" id="d-cap">—</p>
      </div>
      <div class="sheet-txt" id="d-txt"></div>
    </div>
    <div class="sheet-row">
      <div class="sheet-vis">
        <div class="seg-title">Score over the run</div>
        <canvas id="d-chart"></canvas>
        <p class="cap">Turquoise: the photos it trained on. Amber: the one photo it never saw.</p>
      </div>
      <div class="sheet-txt" id="d-txt2"></div>
    </div>
  </div>
</section>

<script type="module" src="js/app.js"></script>
</body>
</html>
